<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Laporan ASAD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Laporan ASAD">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b6b3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
  html{height:100%;margin:0;background:linear-gradient(#0b6b3a 50%,#ffffff 50%)}
  body{position:fixed;inset:0;margin:0;overflow:hidden;box-sizing:border-box;
       padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  iframe{display:block;width:100%;height:100%;border:0;background:#f2f6f3}
  #pesan{display:none;font-family:system-ui,sans-serif;padding:24px;color:#fff;text-align:center}
</style>
</head>
<body>
<iframe id="app" allow="camera *; clipboard-write" title="Laporan ASAD"></iframe>
<div id="pesan">Isi dulu <b>APP_URL</b> di file index.html dengan link aplikasi Apps Script (berakhiran /exec).</div>
<script>
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwbLVGBrmYtmfClCpFUPNeoD5bWEfPMS-YdM56e7V9QnoEw8Hd8V_-5Q8kq8bQTEIYgaw/exec';
  if (APP_URL.indexOf('https://script.google.com/') === 0) {
    document.getElementById('app').src = APP_URL;
  } else {
    document.getElementById('app').style.display = 'none';
    document.getElementById('pesan').style.display = 'block';
  }
</script>
</body>
</html>
